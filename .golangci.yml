version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      # check-type-assertions stays off: the cache stores values the package
      # itself put there, so every `v.(*fooClient)` is guarded by construction.
      # Turning it on only asks for comma-ok noise around invariants.
      check-type-assertions: false
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
      disabled-checks:
        # Suggests inverting an `if` whose body ends in `return` into a
        # `continue`, which reads worse here than the guard it replaces.
        - nestingReduce
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          # A public library: every exported symbol carries a doc comment.
          arguments: [ "checkPrivateReceivers" ]

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers may shadow, hardcode and repeat freely.
      - path: _test\.go$
        linters:
          - errcheck
          - goconst
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/librucha/cloud-go-templates

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
