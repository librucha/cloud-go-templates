name: Build cloud-go-templates
on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # checkout must run before setup-go: go-version-file reads go.mod out of
      # the checked-out tree, so setup-go run first has nothing to resolve
      # the toolchain from. A sibling project got this order wrong and its CI
      # failed for months.
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
